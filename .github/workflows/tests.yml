# Runs lint, the smoke tests and PHPStan on every supported version of PHP, using the same script as running them
# locally (testing/run-all-php-versions.sh), which tests each version in its own Docker container.
# The README's "Tests" badge shows the result of the latest run on the default branch.
name: Tests

on:
    # Pushes to the main branch (not work-in-progress branches), and every tag, e.g. a new release.
    push:
        branches:
            - main
        tags:
            - "*"
    # Pull requests into the main branch, so they are tested before being merged.
    pull_request:
        branches:
            - main
    # Adds a "Run workflow" button on the Actions tab, to run the tests by hand on any branch.
    workflow_dispatch:

# The tests only need to read the code.
permissions:
    contents: read

jobs:
    tests:
        name: Lint, tests and PHPStan on PHP 8.2, 8.3, 8.4 and 8.5
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out the code
              uses: actions/checkout@v5

            # The tests use vendor/autoload.php. The runner's own PHP is only used to run Composer.
            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run lint, the tests and PHPStan on every supported version of PHP
              run: sh testing/run-all-php-versions.sh
